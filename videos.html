<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vídeos · Comarea Arrocería</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:#f5f5f5;font-family:'Raleway',sans-serif;overflow:hidden}
  .top{
    position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
    padding:calc(12px + env(safe-area-inset-top)) 14px 22px;
    background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);pointer-events:none;
  }
  .top > *{pointer-events:auto}
  .back{
    display:inline-flex;align-items:center;gap:5px;flex:none;
    font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:#fff;text-decoration:none;background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px);
  }
  .marca{flex:1;text-align:center;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#ddd}
  .marca b{color:#fff;font-weight:300}
  .marca span{font-family:'Dancing Script',cursive;color:#e03030;letter-spacing:0;font-size:14px}
  .hueco{width:74px;flex:none}
  .filtros{position:fixed;top:calc(52px + env(safe-area-inset-top));left:0;right:0;z-index:10;
    display:flex;gap:7px;justify-content:center;pointer-events:none}
  .f{pointer-events:auto;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);border-radius:999px;
    color:#ddd;font-family:inherit;font-size:12px;font-weight:600;padding:5px 13px;cursor:pointer;backdrop-filter:blur(6px)}
  .f.on{background:#cc1a1a;border-color:#cc1a1a;color:#fff}
  #muro{position:fixed;inset:0}
  .carga{height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:15px}
</style>
</head>
<body>

<div class="top">
  <a class="back" href="index.html">← Inicio</a>
  <div class="marca"><b>COMAREA</b> <span>Arrocería</span></div>
  <div class="hueco"></div>
</div>
<div class="filtros" id="filtros"></div>

<div id="muro"><div class="carga">Cargando vídeos…</div></div>

<script src="media.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   Los vídeos salen de dos sitios, los dos editables en admin.html:
   · datos/videos.json → vídeos generales del local
   · datos/carta.json  → vídeos asociados a cada plato (campo v)
   ══════════════════════════════════════════════════════════════ */
const leer = r => fetch(r + '?v=' + Date.now(), { cache:'no-store' }).then(x => x.ok ? x.json() : null).catch(() => null);
let TODOS = [], filtro = 'Todos', parar = () => {};

function pintar(){
  const lista = filtro === 'Todos' ? TODOS : TODOS.filter(v => v.grupo === filtro);
  parar();
  parar = LAGAR.reels(document.getElementById('muro'), lista);
}

(async function(){
  const [gen, carta] = await Promise.all([leer('datos/videos.json'), leer('datos/carta.json')]);
  (Array.isArray(gen) ? gen : []).forEach(v => {
    if(v && (v.src || v.url) && v.activo !== false) TODOS.push({ ...v, grupo:'El local' });
  });
  (Array.isArray(carta) ? carta : []).forEach(sec => (sec.items||[]).forEach(pl =>
    (Array.isArray(pl.v) ? pl.v : []).forEach(v => {
      if(v && (v.src || v.url)) TODOS.push({ ...v, t: pl.n, s: [sec.title, pl.p].filter(Boolean).join(' · '), grupo:'Platos' });
    })));

  const grupos = [...new Set(TODOS.map(v => v.grupo))];
  if(grupos.length > 1){
    const f = document.getElementById('filtros');
    ['Todos', ...grupos].forEach(g => {
      const b = document.createElement('button');
      b.className = 'f' + (g === filtro ? ' on' : ''); b.textContent = g;
      b.onclick = () => { filtro = g; f.querySelectorAll('.f').forEach(x => x.classList.toggle('on', x === b)); pintar(); };
      f.appendChild(b);
    });
  }
  pintar();
})();
</script>
</body>
</html>
